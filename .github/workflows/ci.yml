name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # A single Linux job. Linux is the canonical platform for the golden / pixel
  # reference tests (they only match on one OS), and this is a pure-Dart package
  # with no platform channels of its own, so running the suite on macOS/Windows
  # too added cost without signal. CI runs once, on Ubuntu: analyze, the full
  # test suite (incl. goldens) with coverage, a web build, and a publish dry-run.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      # Format is checked informationally; the repo predates Dart 3.7's "tall"
      # formatter, so a hard gate would flip on a toolchain bump. Migrate in one
      # dedicated commit, then re-add `--set-exit-if-changed`.
      - run: dart format --output=none lib test || true
      # Full unit/widget suite plus the golden / pixel reference tests, which are
      # canonical on Linux. Only the `screenshots` doc-image generators are
      # excluded (those are regenerated by the docs/Pages workflow).
      - name: Tests (with coverage)
        run: flutter test --coverage --exclude-tags screenshots
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
      # Compile the example to the web target — the native, no-WebView /
      # no-JS-interop proof.
      - name: Build example (web)
        run: flutter build web
        working-directory: example
      # Validate the package is publishable to pub.dev (does not actually publish).
      - name: Publish dry-run
        run: dart pub publish --dry-run
