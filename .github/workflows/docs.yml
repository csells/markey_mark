name: Docs

# Publish the MkDocs site to GitHub Pages. This is a *static* build: it renders
# the committed docs/ (including the committed docs/images/*.png screenshots)
# with mkdocs — no Flutter, no screenshot regeneration. Screenshots are a
# committed artifact, regenerated by a developer/agent when a feature changes
# (see docs/contributing-docs.md and the sync-docs project skill), so the image
# you reviewed in a PR is exactly what ships. That keeps this workflow fast and
# deterministic, and only republishes when docs actually change.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build site
        run: |
          pip install mkdocs-material
          mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
