name: Docs

# Build the user documentation (docs/ + generated screenshots) with MkDocs and
# publish it to GitHub Pages. Screenshots are regenerated from the real editor
# so docs stay in sync with the implementation.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install fonts for screenshots
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: Get packages
        run: flutter pub get

      - name: Regenerate screenshots
        run: flutter test test/docs/generate_screenshots_test.dart

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build site
        run: |
          pip install mkdocs-material
          mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
