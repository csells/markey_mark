name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Analyze, format-check, and run the unit/widget suite + goldens on every OS.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      # Format is checked informationally; the repo predates Dart 3.7's "tall"
      # formatter, so a hard gate would flip on a toolchain bump. Migrate in one
      # dedicated commit, then re-add `--set-exit-if-changed`.
      - run: dart format --output=none lib test || true
      - name: Unit & widget tests (with coverage)
        run: flutter test --coverage --exclude-tags screenshots
      - name: Golden image tests
        run: flutter test --tags golden
      - name: Upload coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  # Prove the package builds for the web target (native, no JS interop required).
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web
        working-directory: example

  # pub.dev publish dry-run / package score.
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart pub publish --dry-run
